services:
  frontend:
    build:
      context: ./idus-frontend
    container_name: idus-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - idus-network

  backend:
    build:
      context: ./idus-backend
    container_name: idus-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and define SECRET_KEY}
      DEBUG: ${DEBUG:-True}
      DATABASE_NAME: ${DATABASE_NAME:-idusdb}
      DATABASE_USER: ${DATABASE_USER:-idususer}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-iduspass}
      DATABASE_HOST: db
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - idus-network

  db:
    image: postgres:15-alpine
    container_name: idus-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-idususer}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-iduspass}
      POSTGRES_DB: ${DATABASE_NAME:-idusdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - idus-network

volumes:
  postgres_data:

networks:
  idus-network:
